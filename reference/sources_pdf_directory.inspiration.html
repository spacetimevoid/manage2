            // Open compact vintage Mac OS X upload modal
            function openUploadModal(mode = 'sources') {
                uploadTargetMode = mode;
                const isProblemMode = mode === 'problems';
                const currentSubj = isProblemMode ? activeProblemSubject : activeSubject;
                const defaultSubject = currentSubj === 'all' ? 'math' : currentSubj;

                uploadPdfForm.reset();
                pdfFileInput.value = '';
                modalPathRootEl.textContent = isProblemMode ? 'Problems' : 'Sources';
                modalPathSubjectInput.value = defaultSubject;
                modalPathFileNameInput.value = '';
                modalPathFileNameInput.placeholder = isProblemMode ? 'new-problem' : 'new-file.pdf';
                modalFileStatus.textContent = 'No file selected';
                modalErrorMsg.textContent = '';

                modalDifficultyField.hidden = !isProblemMode;
                modalDifficultySelect.value = 'med';
                modalDateLabel.textContent = isProblemMode ? 'Added date' : 'Due date';

                if (isProblemMode) {
                    const now = new Date();
                    modalDueDateInput.value = [
                        String(now.getDate()).padStart(2, '0'),
                        String(now.getMonth() + 1).padStart(2, '0'),
                        now.getFullYear()
                    ].join('/');
                }

                uploadModalBackdrop.classList.add('is-open');
                uploadModalBackdrop.setAttribute('aria-hidden', 'false');
                requestAnimationFrame(() => {
                    modalPathFileNameInput.focus();
                });
            }

            function closeUploadModal() {
                uploadModalBackdrop.classList.remove('is-open');
                uploadModalBackdrop.setAttribute('aria-hidden', 'true');
            }

            uploadPdfBtn.addEventListener('click', () => openUploadModal('sources'));
            uploadProblemBtn.addEventListener('click', () => openUploadModal('problems'));
            modalCancelBtn.addEventListener('click', closeUploadModal);

            // Allow pressing Enter inside the inline path inputs to submit the form
            [modalPathSubjectInput, modalPathFileNameInput].forEach((inputEl) => {
                inputEl.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        uploadPdfForm.requestSubmit();
                    }
                });
            });

            // Trigger native file picker from classic Browse... button
            modalBrowseBtn.addEventListener('click', () => {
                pdfFileInput.click();
            });

            let lastAutoFilledFileName = '';

            pdfFileInput.addEventListener('change', (e) => {
                const file = e.target.files && e.target.files[0];
                if (!file) {
                    modalFileStatus.textContent = 'No file selected';
                    return;
                }
                modalFileStatus.textContent = file.name;
                const displayName = uploadTargetMode === 'problems'
                    ? file.name.replace(/\.pdf$/i, '')
                    : file.name;
                const currentInputName = modalPathFileNameInput.value.trim();
                if (!currentInputName || currentInputName === lastAutoFilledFileName) {
                    modalPathFileNameInput.value = displayName;
                    lastAutoFilledFileName = displayName;
                }
                modalErrorMsg.textContent = '';
            });

            // Validate DD/MM/YYYY date string
            function isValidDMYDate(dateStr) {
                const match = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(dateStr);
                if (!match) return false;
                const day = Number(match[1]);
                const month = Number(match[2]);
                const year = Number(match[3]);
                const date = new Date(year, month - 1, day);
                return date.getFullYear() === year && date.getMonth() === month - 1 && date.getDate() === day;
            }

            // Save new PDF entry from modal form and inline path inputs
            uploadPdfForm.addEventListener('submit', (e) => {
                e.preventDefault();
                modalErrorMsg.textContent = '';

                const rawSubject = modalPathSubjectInput.value
                    .trim()
                    .toLowerCase()
                    .replace(/[^a-z0-9-_]+/g, '-')
                    .replace(/^-+|-+$/g, '');

                if (!rawSubject) {
                    modalErrorMsg.textContent = 'Please enter a valid subject in the path.';
                    modalPathSubjectInput.focus();
                    return;
                }

                let rawName = modalPathFileNameInput.value.trim();
                const selectedFile = pdfFileInput.files && pdfFileInput.files[0];

                if (!rawName && selectedFile) {
                    rawName = selectedFile.name;
                }

                if (!rawName) {
                    modalErrorMsg.textContent = 'Please select a PDF or enter a file name in the path.';
                    modalPathFileNameInput.focus();
                    return;
                }

                if (uploadTargetMode === 'problems') {
                    rawName = rawName.replace(/\.pdf$/i, '');
                } else if (!rawName.toLowerCase().endsWith('.pdf')) {
                    rawName += '.pdf';
                }

                const topicVal = modalTopicInput.value.trim() || 'General Notes';
                let dueDateVal = modalDueDateInput.value.trim();

                if (!dueDateVal) {
                    const now = new Date();
                    dueDateVal = [
                        String(now.getDate()).padStart(2, '0'),
                        String(now.getMonth() + 1).padStart(2, '0'),
                        now.getFullYear()
                    ].join('/');
                } else if (!isValidDMYDate(dueDateVal)) {
                    const labelText = uploadTargetMode === 'problems' ? 'Added date' : 'Due date';
                    modalErrorMsg.textContent = `${labelText} must follow DD/MM/YYYY format.`;
                    modalDueDateInput.focus();
                    return;
                }

                // Register new subject if the user typed a custom one on the path
                if (!SUBJECTS.includes(rawSubject)) {
                    SUBJECTS.push(rawSubject);
                    subjectCounts[rawSubject] = 0;
                    problemSubjectCounts[rawSubject] = 0;
                    refreshSubjectDatalist();
                }

                if (uploadTargetMode === 'problems') {
                    const problemEntry = {
                        name: rawName,
                        topic: topicVal,
                        subject: rawSubject,
                        addedDate: dueDateVal,
                        difficulty: modalDifficultySelect.value || 'med',
                        isProblem: true,
                        blobUrl: selectedFile ? URL.createObjectURL(selectedFile) : null
                    };

                    ALL_PROBLEMS.unshift(problemEntry);
                    PRIMARY_PROBLEMS.unshift(problemEntry);
                    problemSubjectCounts[rawSubject] = (problemSubjectCounts[rawSubject] || 0) + 1;

                    lastAutoFilledFileName = '';
                    closeUploadModal();
                    selectProblemSubject(rawSubject);
                } else {
                    const entry = {
                        name: rawName,
                        topic: topicVal,
                        subject: rawSubject,
                        dueDate: dueDateVal,
                        done: false,
                        blobUrl: selectedFile ? URL.createObjectURL(selectedFile) : null
                    };

                    ALL_FILES.unshift(entry);
                    PRIMARY_FILES.unshift(entry);
                    subjectCounts[rawSubject] = (subjectCounts[rawSubject] || 0) + 1;

                    lastAutoFilledFileName = '';
                    closeUploadModal();
                    selectSubject(rawSubject);
                }
            });

            // Initial render
            renderSidebar();
            renderFiles();
            renderProblemSidebar();
            renderProblems();

            if (window.location.hash === '#problems') {
                switchWorkspacePage('problems', false);
            }
        })();
    </script>

</body>
</html>
